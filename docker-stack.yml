version: "3.2"

services:
  # ------------------------------------------------------------
  # 1. Reverse Proxy Service (Nginx / HTTPS Entry Point)
  # ------------------------------------------------------------
  reverse_proxy:
    image: zaher2004/atsea-reverse-proxy:v1.0
    ports:
      - "80:80"     # Standard HTTP Port
      - "443:443"   # Standard HTTPS Port (Fixed from 433)
    secrets:
      - source: revprox_key
        target: revprox_key
      - source: revprox_cert
        target: revprox_cert
    networks:
      - front-tier

  # ------------------------------------------------------------
  # 2. Database Service (PostgreSQL Core DB)
  # ------------------------------------------------------------
  database:
    image: zaher2004/atsea-database:v1.0
    environment:
      POSTGRES_USER: gordonuser
      POSTGRES_DB_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: atsea    
    secrets:
      - postgres_password
    networks:
      - back-tier
    deploy:
      placement:
        constraints:
          # Restrict DB execution to Worker Nodes only
          - 'node.role == worker'

  # ------------------------------------------------------------
  # 3. Application Server (Backend API Service)
  # ------------------------------------------------------------
  appserver:
    image: zaher2004/atsea-appserver:v1.0
    networks:
      - front-tier
      - back-tier
      - payment
    secrets:
      - postgres_password  
    deploy:
      replicas: 2
      update_config:
        parallelism: 2
        failure_action: rollback
      placement:
        constraints:
          - 'node.role == worker'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ------------------------------------------------------------
  # 4. Payment Gateway Service (Secure PCI-DSS Compliant)
  # ------------------------------------------------------------
  payment_gateway:
    image: zaher2004/atsea-paymentgateway:v1.0
    secrets:
      - source: staging_token
        target: payment_token
    networks:
      - payment
    deploy:
      update_config:
        failure_action: rollback
      placement:
        constraints:
          - 'node.role == worker'
          # Enforce placement only on PCI-DSS labeled nodes
          - 'node.labels.pcidss == yes'  
  
  # ------------------------------------------------------------
  # 5. Swarm Visualizer Service (Cluster Topology Dashboard)
  # ------------------------------------------------------------
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8001:8080"
    stop_grace_period: 1m30s
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      update_config:
        failure_action: rollback
      placement:
        constraints:
          # Restrict Visualizer to Manager Node to read docker.sock
          - 'node.role == manager'

# =================================----------------=============
# Networks Definition (Isolation & Encryption)
# =================================----------------=============
networks:
  front-tier:
  back-tier:
  payment:
    driver_opts:
      # Overlay network encryption for payment security
      encrypted: 'yes'

# =================================----------------=============
# External Swarm Secrets Definition
# =================================----------------=============
secrets:
  postgres_password:
    external: true
  staging_token:
    external: true
  revprox_key:
    external: true
  revprox_cert:
    external: true