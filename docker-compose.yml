version: "3.1"

services:
  # ------------------------------------------------------------
  # 1. Reverse Proxy (Nginx Development Build)
  # ------------------------------------------------------------
  reverse_proxy:
    build: ./reverse_proxy
    user: nginx
    ports:
      - "80:80"       # Expose HTTP port to access locally
      - "443:443"     # Expose HTTPS port if configured
    networks:
      - front-tier    # Connect to front-tier to reach appserver

  # ------------------------------------------------------------
  # 2. Database Service (PostgreSQL Local)
  # ------------------------------------------------------------
  database:
    build: 
      context: ./database
    image: atsea_db
    user: postgres
    environment:
      POSTGRES_USER: gordonuser
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: atsea
    ports:
      - "5432:5432"   # Exposed for local DB management tools (e.g. DBeaver)
    networks:
      - back-tier
    secrets:
      - postgres_password

  # ------------------------------------------------------------
  # 3. Application Server (Java Backend + Remote Debugging)
  # ------------------------------------------------------------
  appserver:
    build:
      context: app
      dockerfile: Dockerfile
    image: atsea_app
    user: gordon
    ports:
      - "8080:8080"   # Spring Boot Web Port
      - "5005:5005"   # Java Remote Debugging Port
    networks:
      - front-tier
      - back-tier
    secrets:
      - postgres_password

  # ------------------------------------------------------------
  # 4. Payment Gateway (Mock Service)
  # ------------------------------------------------------------
  payment_gateway:
    build:
      context: payment_gateway
    networks:
      - payment
    secrets:
      - payment_token

# ==============================================================
# Networks Definition (Local Bridge Isolation)
# ==============================================================
networks:
  front-tier:
  back-tier:
  payment:


# ==============================================================
# Secrets Definition (Local Development Files)
# ==============================================================
secrets:
  postgres_password:
    file: ./devsecrets/postgres_password
  payment_token:
    file: ./devsecrets/payment_token